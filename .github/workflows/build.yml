name: Bake content

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bake-content
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Bake projects.json and blog.json into the site
        run: python3 scripts/build.py

      - name: Commit if the generated files changed
        run: |
          if git diff --quiet -- index.html feed.xml sitemap.xml blog; then
            echo "Nothing to bake."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html feed.xml sitemap.xml blog
          # [skip ci] prevents this commit from re-triggering the workflow.
          git commit -m "chore(build): regenerate site from JSON [skip ci]"
          git push
