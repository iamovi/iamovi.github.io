name = "iamovi-github-io"
main = "cloudflare-worker/worker.js"
compatibility_date = "2026-10-29"

[vars]
B2_ENDPOINT = "s3.us-east-005.backblazeb2.com"
B2_REGION = "us-east-005"
B2_BUCKET = "iamovivault"
# Model used by the @ai chat replies (see aiReplyFor in worker.js).
# Groq deprecated llama-3.3-70b-versatile (shutdown 2026-08-16); gpt-oss-120b is the
# recommended replacement. Other options: openai/gpt-oss-20b, qwen/qwen3.8-27b.
GROQ_MODEL = "openai/gpt-oss-120b"

# Secrets (set with `wrangler secret put`, never commit):
#   B2_KEY_ID, B2_APP_KEY
#   SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
#   GROQ_API_KEY  (used only by the @ai replies)

# KV namespace backing the @ai rate limiter. Shared across Worker instances so the
# per-session and global/day caps hold. Create with: wrangler kv namespace create AI_RATE_LIMIT
[[kv_namespaces]]
binding = "AI_RATE_LIMIT"
id = "52f76bab4a0148e78744a97c777cd175"
